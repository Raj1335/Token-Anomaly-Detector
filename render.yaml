services:
  - type: web
    name: token-anomaly-detector-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python main.py run-all --seed 1
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: UPLOAD_USERNAME
        sync: false
      - key: UPLOAD_PASSWORD
        sync: false
      - key: UPLOAD_SECRET_KEY
        sync: false
